<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<style>
  :root { color-scheme: light dark;
          --bg: #f5f5f4; --panel: #ffffff; --text: #1c1917; --muted: #6f6a64;
          --border: #e4e2df; --border-strong: #d6d3d1; --live: #2563eb; --danger: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --panel: #1b1b19; --text: #ecebe8; --muted: #a29e97;
            --border: #2e2d2a; --border-strong: #3a3936; --live: #6b9bf7; --danger: #f2706a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 352px; margin: 20vh auto 0; padding: 0 16px; }
  form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  h1 { font-size: 15px; line-height: 20px; font-weight: 600; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type=password] { width: 100%; height: 36px; font: inherit; font-size: 14px; padding: 0 10px; border-radius: 6px;
                         border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); }
  input[type=password]:focus { outline: 2px solid var(--live); outline-offset: 1px; }
  .hidden { display: none; }
  button { margin-top: 12px; width: 100%; height: 36px; font: inherit; font-weight: 500; border: 0; border-radius: 6px;
           cursor: pointer; background: var(--text); color: var(--panel); }
  button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 18px; margin: 10px 0 0; font-size: 12px; color: var(--danger); }
</style>
</head>
<body>
<main>
  <form id="f" autocomplete="on">
    <h1>Account toggler</h1>
    <input class="hidden" type="text" name="username" autocomplete="username" value="master" readonly tabindex="-1" aria-hidden="true">
    <label for="pw">Master password</label>
    <input id="pw" type="password" name="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Sign in</button>
    <p id="msg" role="alert"></p>
  </form>
</main>
<script>
  const f = document.getElementById("f"), go = document.getElementById("go"), msg = document.getElementById("msg");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    go.disabled = true;
    msg.textContent = "";
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.ok) { location.replace("/"); return; }
      msg.textContent = d.output || `Sign-in failed (${r.status}).`;
    } catch (err) {
      msg.textContent = "Could not reach the server.";
    }
    go.disabled = false;
    document.getElementById("pw").select();
  });
</script>
</body>
</html>
